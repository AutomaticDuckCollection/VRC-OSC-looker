[package]
name = "vrc-osc-looker"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Read-only, local-only VRChat OSC debug monitor (terminal UI)"
license = "MIT"
publish = false

[dependencies]
rosc = { version = "0.11.4", default-features = false }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29.0", default-features = false, features = ["events", "windows"] }
serde_json = { version = "1.0.145", default-features = false, features = ["std"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
